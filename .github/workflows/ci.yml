name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: extractions/setup-just@v4
      - run: bun install --frozen-lockfile
      - run: just check-ci
      - run: just types
      - run: just test
      - run: just validate-data data/fixtures/mini
      - run: just validate-eval
      - run: bun apps/cli/src/main.ts eval --set eval/fixtures --projects data/fixtures --fake --out eval/out
      - if: hashFiles('data/projects/alpha/**') != ''
        run: just validate-data data/projects/alpha
